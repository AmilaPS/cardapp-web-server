    <script>
        window.ENV_PYTHON_PORT = "{{PYTHON_PORT}}";

        const CURRENT_HOST = window.location.hostname;
        const rawPyPort = window.ENV_PYTHON_PORT && !window.ENV_PYTHON_PORT.includes("{{") 
                        ? window.ENV_PYTHON_PORT 
                        : 8001;

        let BACKEND_STATIC;

        // Railway Public Domain එකක්ද නැතහොත් Local Port එකක්ද යන්න Check කිරීම
        if (typeof rawPyPort === 'string' && rawPyPort.startsWith('http')) {
            BACKEND_STATIC = rawPyPort;
        } else {
            BACKEND_STATIC = `http://${CURRENT_HOST}:${rawPyPort}`;
        }

        const API_URL = `${BACKEND_STATIC}/api`;
        
        const VIDEO_SERVER_BASE = window.location.origin; // Express App Origin (Port 3000)
        const AUTH_SERVER_URL = "{{AUTH_SERVER}}";
        const SHARE_BASE_LINK = "{{SHARE_LINK}}";
        const HOME_PAGE_LINK = "{{PAGE_LINK}}";

        let currentCardId = null;
        let cardMetadata = null;
        let globalFetchedHints = [];
        let uploadedImagesRegistry = [];
        let activeTrayImageBase64 = null;
        let activeThumbnailContainer = null;
        let selectedTrayImageBase64 = null;
        let finalProcessedBlobsMap = {};
        let generatedPdfFileName = null;
        let generatedVideoFileName = null;

        const modal = document.getElementById('cropper-modal');
        const targetImg = document.getElementById('movable-target-img');
        const viewportBox = document.getElementById('crop-box-viewport');
        const cropBox = document.getElementById('live-crop-box');
        const resizeHandle = document.getElementById('live-resize-handle');

        let boxX = 0, boxY = 0, boxWidth = 150, boxHeight = 150;
        let isDraggingBox = false, isResizingBox = false;
        let startMouseX = 0, startMouseY = 0, startBoxX = 0, startBoxY = 0;
        let startBoxWidth = 0, startBoxHeight = 0;
        let currentMaskAspect = 1;
        let activeTargetSlotId = null;

        function formatNumberWithCommas(x) { return x ? x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",") : "0"; }

        async function loadGlobalShareClickStats() {
            try {
                const res = await fetch('/api/analytics/share-stats');
                const data = await res.json();
                if (data.success && data.stats) {
                    ['whatsapp', 'facebook', 'instagram', 'tiktok'].forEach(platform => {
                        const globalKey = `global_${platform}`;
                        const countElem = document.getElementById(`count_${platform}`);
                        if (countElem && data.stats[globalKey] !== undefined) {
                            countElem.innerText = formatNumberWithCommas(data.stats[globalKey]);
                        }
                    });
                }
            } catch (e) { console.warn("Could not load global share stats"); }
        }

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        function getCardWebIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('card_id');
        }

        async function fetchHintsFromAPI() {
            try {
                const response = await fetch(`${API_URL}/hints`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.hintsString) {
                        globalFetchedHints = data.hintsString.split(',').map(h => h.trim());
                    }
                }
            } catch (error) { console.error("Failed to fetch hints from FastAPI engine:", error); }
        }

        async function loadCardWorkspace() {
            const webIdFromUrl = getCardWebIdFromUrl();
            if (!webIdFromUrl) {
                alert("❌ Card ID missing in URL.");
                window.location.href = "/cards";
                return;
            }

            await fetchHintsFromAPI();

            try {
                const res = await fetch(`${API_URL}/cards`);
                if (!res.ok) throw new Error("Failed to fetch cards registry");
                const allCards = await res.json();

                let matchedCard = allCards.find(c => c.card_web_id === webIdFromUrl) || allCards.find(c => c.card_id === webIdFromUrl);

                if (!matchedCard) {
                    alert("❌ Card structure not found in database.");
                    return;
                }

                currentCardId = matchedCard.card_id; // e.g. CC0001
                const detailRes = await fetch(`${API_URL}/cards/${currentCardId}`);
                const detailData = await detailRes.json();
                const card = detailData.card;

                cardMetadata = {
                    id: card.card_id,
                    cardmaker_id: card.card_id,
                    card_web_id: card.card_web_id,
                    name: card.card_name,
                    folder_name: card.folder_name,
                    image_slots: card.image_slots || "image_01",
                    text_slots: card.text_slots || "text_01",
                    preview_canvas_id: card.preview_canvas_id,
                    design_canvas_id: card.design_canvas_id,
                    cut_crease_canvas_id: card.cut_crease_canvas_id,
                    api_link: card.api_link,
                    keywords: card.keywords || "all"
                };

                document.getElementById('workspace-card-name').innerText = cardMetadata.name || "Personalisierte Karte";
                
                let realFolder = cardMetadata.folder_name;
                const previewImgEl = document.getElementById('main-card-preview');
                
                if (card.saved_preview_file && card.saved_preview_file !== 'none') {
                    previewImgEl.src = `${BACKEND_STATIC}/image_templates/${realFolder}/preview/${card.saved_preview_file}`;
                } else if (card.card_image) {
                    previewImgEl.src = card.card_image;
                } else {
                    previewImgEl.src = `${BACKEND_STATIC}/image_templates/${realFolder}/${realFolder}_preview.png`;
                }

                renderDynamicSlots(cardMetadata);
                loadSavedTrayImages();
            } catch (error) {
                console.error("Critical failure during workspace init:", error);
            }
        }

        // 🎯 STRICT SLOTS DATA PARSER FIX
        function parseSlotsData(slotsField) {
            if (!slotsField || slotsField.trim() === "") return [];
            if (Array.isArray(slotsField)) {
                return slotsField.map(s => s ? s.trim() : "").filter(s => s !== "" && s !== "-" && s !== "_");
            }
            try {
                if (slotsField.trim().startsWith('[')) {
                    const parsed = JSON.parse(slotsField);
                    if (Array.isArray(parsed)) {
                        return parsed.map(s => s ? String(s).trim() : "").filter(s => s !== "" && s !== "-" && s !== "_");
                    }
                    return [];
                }
            } catch(e) {}
            
            // Filter out empty spaces, dashes, and invalid characters
            return slotsField.split(',')
                .map(s => s.trim())
                .filter(s => s !== "" && s !== "-" && s !== "_" && s !== "null" && s !== "undefined");
        }

        document.addEventListener("DOMContentLoaded", () => {
            const container = document.querySelector('.canvas-container');
            const previewImg = document.getElementById('main-card-preview');

            if (container && previewImg) {
                container.addEventListener('mousemove', (e) => {
                    if (window.innerWidth <= 768) return; 
                    const rect = container.getBoundingClientRect();
                    const x = e.clientX - rect.left; const y = e.clientY - rect.top;
                    previewImg.style.transformOrigin = `${(x / rect.width) * 100}% ${(y / rect.height) * 100}%`;
                });
                container.addEventListener('mouseleave', () => { previewImg.style.transformOrigin = 'center center'; });
            }

            const breadcrumbMobile = document.querySelector('#breadcrumb .limiter');
            if (breadcrumbMobile) {
                breadcrumbMobile.addEventListener('click', function(e) {
                    if (window.innerWidth <= 768 && e.offsetX < 100) { 
                        window.location.href = "{{AUTH_SERVER}}/mypersonello";
                    }
                });
            }
        });

        // 🎯 EXACT DYNAMIC SLOTS RENDER ENGINE
        function renderDynamicSlots(card) {
            const imageContainer = document.getElementById('imageSlotsContainer');
            const textContainer = document.getElementById('textSlotsContainer');
            
            const textPanelBox = textContainer ? textContainer.closest('.panel-box') : null;
            const imagePanelBox = imageContainer ? imageContainer.closest('.panel-box') : null;

            imageContainer.innerHTML = '';
            textContainer.innerHTML = '';

            const parsedImages = parseSlotsData(card.image_slots);
            const parsedTexts = parseSlotsData(card.text_slots);

            let instructionElem = document.getElementById('slot-instruction-text');
            if (!instructionElem) {
                instructionElem = document.createElement('p');
                instructionElem.id = 'slot-instruction-text';
                instructionElem.style.cssText = "display: none; font-size: 13px; color: #555; text-align: center; margin: 8px 0; width: 100%; font-weight: bold;";
                imageContainer.parentNode.insertBefore(instructionElem, imageContainer);
            }

            if (parsedImages.length > 1) {
                instructionElem.style.display = 'block';
                instructionElem.classList.add('instruction-text');
                instructionElem.innerText = "*Wählen Sie oben ein Bild aus und klicken Sie dann auf das Feld darunter, um es zuzuschneiden!";
            } else {
                instructionElem.style.display = 'none';
            }

            parsedImages.forEach(slot => {
                const slotNum = slot.replace(/[^0-9]/g, '') || '01';
                const savedSrc = finalProcessedBlobsMap[slot] || `/web_images/thumb_${slotNum}.svg`;
                imageContainer.innerHTML += `
                    <div class="valentine-slot" id="slot_container_${slot}" onclick="onSlotClick('${slot}')">
                        <img id="thumb_${slot}" src="${savedSrc}" alt="${slot}">
                    </div>
                `;
            });

            parsedTexts.forEach((slot, index) => {
                const slotNum = slot.replace(/[^0-9]/g, '') || String(index + 1);
                let placeholderValue = globalFetchedHints[index] || `Text slot ${slotNum}`;
                const savedTxtValue = sessionStorage.getItem(`saved_unieditor_${currentCardId}_${slot}`) || '';

                textContainer.innerHTML += `
                    <div class="input-group" id="group_${slot}">
                        <span class="slot-label-span">Text ${slotNum}:</span>
                        <input type="text" id="input-${slot}" class="text-field" placeholder="${placeholderValue}" value="${savedTxtValue}" oninput="sessionStorage.setItem('saved_unieditor_${currentCardId}_${slot}', this.value)">
                    </div>
                `;
            });

            // 🎯 IMAGE PANEL HIDE / SHOW CHECK
            if (parsedImages.length === 0 && imagePanelBox) {
                imagePanelBox.style.display = 'none';
            } else if (imagePanelBox) {
                imagePanelBox.style.display = 'block';
            }

            // 🎯 TEXT PANEL HIDE / SHOW CHECK (EXACT 0 LENGTH CHECK)
            if (parsedTexts.length === 0 && textPanelBox) {
                textPanelBox.style.display = 'none';
            } else if (textPanelBox) {
                textPanelBox.style.display = 'block';
            }
        }

        function handleImageUpload(event) {
            const files = event.target.files;
            const tray = document.getElementById('blue-preview-tray');
            const hintText = document.getElementById('empty-hint-text');

            if (files.length > 0 && hintText) hintText.remove();

            for (let i = 0; i < files.length; i++) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 800;
                        let width = img.width, height = img.height;

                        if (width > height) {
                            if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                        } else {
                            if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                        }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
                        uploadedImagesRegistry.push(compressedBase64);
                        sessionStorage.setItem('saved_tray_images_unieditor', JSON.stringify(uploadedImagesRegistry));

                        appendThumbToTray(compressedBase64);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(files[i]);
            }
        }

        function appendThumbToTray(base64Src) {
            const tray = document.getElementById('blue-preview-tray');
            const thumbWrapper = document.createElement('div');
            thumbWrapper.className = 'preview-thumb-container';
            const imgEl = document.createElement('img');
            imgEl.src = base64Src;
            thumbWrapper.appendChild(imgEl);

            thumbWrapper.onclick = function() {
                document.querySelectorAll('.preview-thumb-container').forEach(el => el.classList.remove('selected'));
                thumbWrapper.classList.add('selected');
                activeThumbnailContainer = thumbWrapper;
                onTrayImageClick(base64Src);
            };

            tray.appendChild(thumbWrapper);
        }

        function loadSavedTrayImages() {
            const savedTray = sessionStorage.getItem('saved_tray_images_unieditor');
            const tray = document.getElementById('blue-preview-tray');
            const hintText = document.getElementById('empty-hint-text');

            if (savedTray && tray) {
                uploadedImagesRegistry = JSON.parse(savedTray);
                if (uploadedImagesRegistry.length > 0 && hintText) hintText.remove();
                uploadedImagesRegistry.forEach(rawBase64 => appendThumbToTray(rawBase64));
            }

            const parsedImages = parseSlotsData(cardMetadata.image_slots);
            parsedImages.forEach(slot => {
                const localSaved = sessionStorage.getItem(`saved_unieditor_${currentCardId}_${slot}`);
                if (localSaved) {
                    finalProcessedBlobsMap[slot] = localSaved;
                    const thumb = document.getElementById(`thumb_${slot}`);
                    if (thumb) thumb.src = localSaved;
                }
            });
        }

        function onTrayImageClick(base64Src) {
            const parsedImages = cardMetadata ? parseSlotsData(cardMetadata.image_slots) : [];
            if (parsedImages.length > 1) {
                selectedTrayImageBase64 = base64Src;
                activeTrayImageBase64 = base64Src;
            } else if (parsedImages.length === 1) {
                selectedTrayImageBase64 = base64Src;
                activeTrayImageBase64 = base64Src;
                openSlotCropper(parsedImages[0]);
            }
        }

        function onSlotClick(slotId) {
            const parsedImages = cardMetadata ? parseSlotsData(cardMetadata.image_slots) : [];
            if (parsedImages.length > 1) {
                if (!selectedTrayImageBase64) return alert("Bitte wählen Sie zuerst oben ein Bild aus!");
                openSlotCropper(slotId);
            } else {
                if (activeTrayImageBase64) openSlotCropper(slotId);
                else alert("Bitte wählen Sie zuerst oben ein Bild aus!");
            }
        }

        function openSlotCropper(slotId) {
            if (!activeTrayImageBase64) return alert("❌ Bitte wählen Sie zuerst ein Bild aus der Leiste oben aus.");
            activeTargetSlotId = slotId;
            const slotNum = slotId.replace(/[^0-9]/g, '') || '01';
            const maskFileName = `cropb${slotNum}.png`;

            const overlayImg = document.getElementById('crop-mask-overlay');
            overlayImg.src = '/web_images/' + maskFileName + '?t=' + Date.now();

            const tempMaskImg = new Image();
            tempMaskImg.onload = function() {
                currentMaskAspect = tempMaskImg.naturalWidth / tempMaskImg.naturalHeight;

                targetImg.onload = function() {
                    setTimeout(() => {
                        const imgW = targetImg.offsetWidth;
                        const imgH = targetImg.offsetHeight;
                        let initialW = imgW * 0.7;
                        let initialH = initialW / currentMaskAspect;

                        if (initialH > imgH * 0.7) {
                            initialH = imgH * 0.7;
                            initialW = initialH * currentMaskAspect;
                        }

                        boxWidth = initialW; boxHeight = initialH;
                        boxX = (imgW - boxWidth) / 2; boxY = (imgH - boxHeight) / 2;
                        viewportBox.style.width = imgW + 'px'; viewportBox.style.height = imgH + 'px';
                        updateCropBoxDOM();
                        modal.classList.add('active');
                    }, 50);
                }
                targetImg.src = activeTrayImageBase64;
            };
            tempMaskImg.src = '/web_images/' + maskFileName + '?t=' + Date.now();
        }

        function closeCropModal() { modal.classList.remove('active'); }

        function updateCropBoxDOM() {
            cropBox.style.left = boxX + 'px';
            cropBox.style.top = boxY + 'px';
            cropBox.style.width = boxWidth + 'px';
            cropBox.style.height = boxHeight + 'px';
        }

        function getEventClientCoords(e) {
            if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            return { x: e.clientX, y: e.clientY };
        }

        function dragStartHandler(e) {
            if (e.target === resizeHandle) return;
            isDraggingBox = true;
            const coords = getEventClientCoords(e);
            startMouseX = coords.x; startMouseY = coords.y; startBoxX = boxX; startBoxY = boxY;
        }

        function resizeStartHandler(e) {
            e.stopPropagation(); e.preventDefault();
            isResizingBox = true;
            const coords = getEventClientCoords(e);
            startMouseX = coords.x; startMouseY = coords.y; startBoxWidth = boxWidth; startBoxHeight = boxHeight; startBoxX = boxX; startBoxY = boxY;
        }

        cropBox.addEventListener('mousedown', dragStartHandler);
        cropBox.addEventListener('touchstart', dragStartHandler, { passive: true });
        resizeHandle.addEventListener('mousedown', resizeStartHandler);
        resizeHandle.addEventListener('touchstart', resizeStartHandler, { passive: false });

        function moveTrackHandler(e) {
            if (!isDraggingBox && !isResizingBox) return;
            const imgW = targetImg.offsetWidth, imgH = targetImg.offsetHeight;
            const coords = getEventClientCoords(e);

            if (isDraggingBox) {
                let dx = coords.x - startMouseX; let dy = coords.y - startMouseY;
                boxX = Math.max(0, Math.min(imgW - boxWidth, startBoxX + dx));
                boxY = Math.max(0, Math.min(imgH - boxHeight, startBoxY + dy));
                updateCropBoxDOM();
            }

            if (isResizingBox) {
                let dx = coords.x - startMouseX;
                let newWidth = Math.max(50, startBoxWidth + dx);
                let newHeight = newWidth / currentMaskAspect;

                if ((startBoxX + newWidth) <= imgW && (startBoxY + newHeight) <= imgH) {
                    boxWidth = newWidth; boxHeight = newHeight;
                    updateCropBoxDOM();
                }
            }
        }

        window.addEventListener('mousemove', moveTrackHandler);
        window.addEventListener('touchmove', moveTrackHandler, { passive: false });

        function applyAndCropImage() {
            const slotNum = activeTargetSlotId.replace(/[^0-9]/g, '') || '01';
            const maskImg = new Image();
            maskImg.src = '/web_images/crop' + slotNum + '.png?t=' + Date.now();

            maskImg.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = maskImg.naturalWidth; canvas.height = maskImg.naturalHeight;
                const ctx = canvas.getContext('2d');
                const scale = targetImg.naturalWidth / targetImg.offsetWidth;

                ctx.drawImage(maskImg, 0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'source-in';
                ctx.drawImage(targetImg, boxX * scale, boxY * scale, boxWidth * scale, boxHeight * scale, 0, 0, canvas.width, canvas.height);

                ctx.globalCompositeOperation = 'destination-over';
                ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'source-over';

                const maskedResultBase64 = canvas.toDataURL('image/jpeg', 0.7);

                        <div class="result-content-row">
                            ${videoBlockHTML}
                            <div class="buttons-holder" style="display: flex; flex-direction: column; align-items: center; gap: 15px;">
                                <div class="pso-3d-buttons-row">
                                    ${pdfBtnHTML}
                                    ${videoDownloadBtnHTML}
                                </div>
                                ${shareTrayHTML}
                            </div>
                        </div>
                    </div>
                `;

                setTimeout(loadGlobalShareClickStats, 300);

            } catch (err) {
                console.error("Card Generation Error:", err);
            } finally {
                buttons.forEach(btn => { btn.style.pointerEvents = 'auto'; btn.style.opacity = '1'; });
                resultsTitle.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function endDragResizeHandler() { isDraggingBox = false; isResizingBox = false; }
        window.addEventListener('mouseup', endDragResizeHandler);
        window.addEventListener('touchend', endDragResizeHandler);

        window.onload = loadCardWorkspace;
    </script>
</body>
</html>
